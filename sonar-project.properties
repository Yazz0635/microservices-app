# Replace both values with the ones SonarCloud shows for your project
sonar.organization=YOUR_SONAR_ORGANIZATION_KEY
sonar.projectKey=YOUR_SONAR_PROJECT_KEY

sonar.sources=api/server.js,frontend/server.js,frontend/public
sonar.tests=api/server.test.js,frontend/server.test.js
sonar.javascript.lcov.reportPaths=api/coverage/lcov.info,frontend/coverage/lcov.info
sonar.qualitygate.wait=true
